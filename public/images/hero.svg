<svg viewBox="0 0 1600 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A young copy editor proofreading at a desk in a vintage newsroom">
<style>
.fl{animation:fl 6s ease-in-out infinite alternate}
.fl2{animation:fl 8s ease-in-out -2s infinite alternate}
.fl3{animation:fl 7s ease-in-out -4s infinite alternate}
@keyframes fl{from{transform:translateY(-8px) rotate(-2deg)}to{transform:translateY(10px) rotate(2deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:sp 16s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.hand{transform-origin:1262px 168px;animation:sp 12s steps(60) infinite}
.glow{animation:gl 3.5s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.75}to{opacity:1}}
.pen{transform-origin:1012px 452px;animation:pn 1.6s ease-in-out infinite alternate}
@keyframes pn{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.sweat{animation:sw 3s ease-in infinite}
@keyframes sw{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.mark{stroke-dasharray:80;animation:dr 5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:80}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:80}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#f3e9cf" /><stop offset=".45" stop-color="#ecdcb8" /><stop offset="1" stop-color="#d9bf93" /></linearGradient>
<radialGradient id="lg"><stop offset="0" stop-color="#ffd98a" stop-opacity=".85" /><stop offset="1" stop-color="#ffd98a" stop-opacity="0" /></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5e3d" /><stop offset="1" stop-color="#5b3b26" /></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5236" /><stop offset="1" stop-color="#4a2f1e" /></linearGradient>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4" /><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .13 0" /></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6" /></filter>
